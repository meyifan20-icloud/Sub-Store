services:
  sub-store:
    build:
      context: .
      dockerfile: Dockerfile
    image: meyifan20-icloud/sub-store:local
    container_name: sub-store
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SUB_STORE_BACKEND_API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data:/opt/app/data
    healthcheck:
      test: ["CMD", "node", "/opt/app/healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
