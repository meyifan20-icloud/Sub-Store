name: 手动同步官方上游 / Sync Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    name: 同步 sub-store-org/Sub-Store → master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout personal repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify origin is personal repository
        shell: bash
        run: |
          ORIGIN_URL="$(git remote get-url origin)"
          echo "origin=$ORIGIN_URL"
          case "$ORIGIN_URL" in
            *"meyifan20-icloud/Sub-Store.git"|*"meyifan20-icloud/Sub-Store") ;;
            *)
              echo "Unexpected origin: $ORIGIN_URL"
              exit 1
              ;;
          esac

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Save personal overlay
        shell: bash
        run: |
          mkdir -p /tmp/personal-overlay
          cp README.md /tmp/personal-overlay/README.md
          cp .github/workflows/sync-upstream.yml /tmp/personal-overlay/sync-upstream.yml
          echo "BEFORE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fetch official upstream
        shell: bash
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/sub-store-org/Sub-Store.git
          git fetch upstream master

      - name: Merge upstream safely
        shell: bash
        run: |
          git merge --no-edit -X ours upstream/master

      - name: Restore protected personal overlay
        shell: bash
        run: |
          cp /tmp/personal-overlay/sync-upstream.yml .github/workflows/sync-upstream.yml

          python3 - <<'PY'
          from pathlib import Path

          current = Path("README.md").read_text(encoding="utf-8")
          saved = Path("/tmp/personal-overlay/README.md").read_text(encoding="utf-8")
          start = "<!-- PERSONAL-UPSTREAM-SYNC:START -->"
          end = "<!-- PERSONAL-UPSTREAM-SYNC:END -->"

          def extract_block(text):
              if start in text and end in text:
                  s = text.index(start)
                  e = text.index(end, s) + len(end)
                  return text[s:e].strip()
              return ""

          personal = extract_block(saved)
          if personal:
              if start in current and end in current:
                  s = current.index(start)
                  e = current.index(end, s) + len(end)
                  current = current[:s] + personal + current[e:]
              else:
                  current = personal + "\n\n" + current.lstrip()

          Path("README.md").write_text(current, encoding="utf-8")
          PY

      - name: Mirror upstream release install assets into personal repository
        shell: bash
        env:
          PERSONAL_REPO: meyifan20-icloud/Sub-Store
          UPSTREAM_REPO: sub-store-org/Sub-Store
          PERSONAL_BRANCH: master
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          upstream = os.environ["UPSTREAM_REPO"]
          latest = re.compile(
              rf"https://github\.com/{re.escape(upstream)}/releases/latest/download/([^,\s\)\]\"'<>?#]+)"
          )
          tagged = re.compile(
              rf"https://github\.com/{re.escape(upstream)}/releases/download/([^/,\s\)\]\"'<>?#]+)/([^,\s\)\]\"'<>?#]+)"
          )

          files = subprocess.check_output(["git", "ls-files", "-z", "--", ".", ":(exclude).upstream-release-assets/**"]).split(b"\0")
          urls = set()

          for raw in files:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8", errors="surrogateescape"))
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              urls.update(m.group(0).rstrip(",.;:") for m in latest.finditer(text))
              urls.update(m.group(0).rstrip(",.;:") for m in tagged.finditer(text))

          with open("/tmp/release-assets.tsv", "w", encoding="utf-8") as out:
              for url in sorted(urls):
                  m = latest.fullmatch(url)
                  if m:
                      rel = Path(".upstream-release-assets") / "latest" / m.group(1)
                  else:
                      m = tagged.fullmatch(url)
                      rel = Path(".upstream-release-assets") / m.group(1) / m.group(2)
                  out.write(f"{url}\t{rel.as_posix()}\n")

          print(f"Release install assets to mirror: {len(urls)}")
          PY

          while IFS=$'\t' read -r url target; do
            [ -n "$url" ] || continue
            mkdir -p "$(dirname "$target")"
            echo "Mirroring $url -> $target"
            curl -fL --retry 3 --retry-delay 2 --max-time 120 "$url" -o "$target"
            SIZE=$(wc -c < "$target")
            if [ "$SIZE" -gt 52428800 ]; then
              echo "Release asset exceeds 50 MiB safety limit: $target ($SIZE bytes)"
              exit 1
            fi
          done < /tmp/release-assets.tsv

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          personal = os.environ["PERSONAL_REPO"]
          branch = os.environ["PERSONAL_BRANCH"]

          mapping = {}
          manifest = Path("/tmp/release-assets.tsv")
          if manifest.exists():
              for line in manifest.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  url, target = line.split("\t", 1)
                  mapping[url] = f"https://raw.githubusercontent.com/{personal}/{branch}/{target}"

          files = subprocess.check_output(["git", "ls-files", "-z", "--", ".", ":(exclude).upstream-release-assets/**"]).split(b"\0")
          for raw in files:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8", errors="surrogateescape"))
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              new = text
              for old, replacement in mapping.items():
                  new = new.replace(old, replacement)

              if new != text:
                  path.write_text(new, encoding="utf-8")
          PY

      - name: Rewrite runtime and install resource endpoints twice
        shell: bash
        env:
          PERSONAL_REPO: meyifan20-icloud/Sub-Store
          UPSTREAM_REPO: sub-store-org/Sub-Store
          UPSTREAM_BRANCH: master
        run: |
          cat > /tmp/rewrite-personal-endpoints.py <<'PY'
          import os
          import subprocess
          from pathlib import Path

          personal = os.environ["PERSONAL_REPO"]
          upstream = os.environ["UPSTREAM_REPO"]
          branch = os.environ["UPSTREAM_BRANCH"]

          replacements = {
              f"https://raw.githubusercontent.com/{upstream}/{branch}/":
                  f"https://raw.githubusercontent.com/{personal}/{branch}/",
              f"https://raw.githubusercontent.com/{upstream}/refs/heads/{branch}/":
                  f"https://raw.githubusercontent.com/{personal}/refs/heads/{branch}/",
              f"https://cdn.jsdelivr.net/gh/{upstream}@{branch}/":
                  f"https://cdn.jsdelivr.net/gh/{personal}@{branch}/",
              f"https://deploy.workers.cloudflare.com/?url=https://github.com/{upstream}":
                  f"https://deploy.workers.cloudflare.com/?url=https://github.com/{personal}",
              f"https://vercel.com/new/clone?repository-url=https://github.com/{upstream}":
                  f"https://vercel.com/new/clone?repository-url=https://github.com/{personal}",
              f"git clone https://github.com/{upstream}.git":
                  f"git clone https://github.com/{personal}.git",
              f"git clone https://github.com/{upstream}":
                  f"git clone https://github.com/{personal}",
          }

          files = subprocess.check_output(["git", "ls-files", "-z", "--", ".", ":(exclude).upstream-release-assets/**"]).split(b"\0")
          changed = []

          for raw in files:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8", errors="surrogateescape"))
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)

              if new != text:
                  path.write_text(new, encoding="utf-8")
                  changed.append(str(path))

          print(f"Rewritten files: {len(changed)}")
          for path in changed:
              print(f"  - {path}")
          PY

          python3 /tmp/rewrite-personal-endpoints.py
          python3 /tmp/rewrite-personal-endpoints.py

      - name: Verify protected workflow and personal endpoints
        shell: bash
        env:
          PERSONAL_REPO: meyifan20-icloud/Sub-Store
          UPSTREAM_REPO: sub-store-org/Sub-Store
          UPSTREAM_BRANCH: master
        run: |
          cmp -s .github/workflows/sync-upstream.yml /tmp/personal-overlay/sync-upstream.yml || {
            echo "Protected sync workflow changed unexpectedly."
            exit 1
          }

          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          personal = os.environ["PERSONAL_REPO"]
          upstream = os.environ["UPSTREAM_REPO"]
          branch = os.environ["UPSTREAM_BRANCH"]

          forbidden_literals = (
              f"https://raw.githubusercontent.com/{upstream}/{branch}/",
              f"https://raw.githubusercontent.com/{upstream}/refs/heads/{branch}/",
              f"https://cdn.jsdelivr.net/gh/{upstream}@{branch}/",
              f"https://deploy.workers.cloudflare.com/?url=https://github.com/{upstream}",
              f"https://vercel.com/new/clone?repository-url=https://github.com/{upstream}",
              f"git clone https://github.com/{upstream}.git",
              f"git clone https://github.com/{upstream}",
          )
          release_download = re.compile(
              rf"https://github\.com/{re.escape(upstream)}/releases/(?:latest/download|download/[^/\s]+)/"
          )

          files = subprocess.check_output(["git", "ls-files", "-z", "--", ".", ":(exclude).upstream-release-assets/**"]).split(b"\0")
          bad = []

          for raw in files:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8", errors="surrogateescape"))
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              for lineno, line in enumerate(text.splitlines(), 1):
                  if any(item in line for item in forbidden_literals) or release_download.search(line):
                      bad.append(f"{path}:{lineno}: {line.strip()}")

          readme = Path("README.md").read_text(encoding="utf-8")
          required = (
              f"https://github.com/{personal}",
              f"https://raw.githubusercontent.com/{personal}/master/",
              "<!-- PERSONAL-UPSTREAM-SYNC:START -->",
              "<!-- PERSONAL-UPSTREAM-SYNC:END -->",
          )
          missing = [item for item in required if item not in readme]

          if bad:
              print("Blocked: upstream runtime/install endpoints remain:")
              for item in bad:
                  print(item)

          if missing:
              print("Blocked: personal README overlay is incomplete:")
              for item in missing:
                  print(item)

          if bad or missing:
              sys.exit(1)

          print("Verified: personal runtime/install endpoints and protected overlay are intact.")
          PY

      - name: Commit synchronization result
        shell: bash
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add -A
            git commit -m "chore: sync official upstream"
          fi

      - name: Final origin check and push
        shell: bash
        run: |
          AFTER_SHA="$(git rev-parse HEAD)"

          if [ "$BEFORE_SHA" = "$AFTER_SHA" ]; then
            echo "No upstream changes. Personal repository is already up to date."
            exit 0
          fi

          ORIGIN_URL="$(git remote get-url origin)"
          case "$ORIGIN_URL" in
            *"meyifan20-icloud/Sub-Store.git"|*"meyifan20-icloud/Sub-Store") ;;
            *)
              echo "Unexpected origin before push: $ORIGIN_URL"
              exit 1
              ;;
          esac

          git push origin HEAD:master
