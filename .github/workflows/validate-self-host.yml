name: Validate self-host deployments

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".env.example"
      - ".node-version"
      - "Makefile"
      - "deploy/**"
      - "backend/package.json"
      - "backend/pnpm-lock.yaml"
      - "backend/patches/**"
      - ".github/workflows/validate-self-host.yml"

permissions:
  contents: read

concurrency:
  group: validate-self-host
  cancel-in-progress: true

jobs:
  node-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate shell scripts
        run: |
          sh -n deploy/runtime/start.sh
          sh -n deploy/node/prepare-runtime.sh
          bash -n deploy/termux/install.sh

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Build backend
        run: |
          corepack enable
          cd backend
          pnpm install --frozen-lockfile
          pnpm bundle:esbuild
          test -s dist/sub-store.bundle.js
          test -s dist/runtime-manifest.json

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config >/tmp/sub-store-compose.yml
          test -s /tmp/sub-store-compose.yml

      - name: Build full self-host image
        run: |
          docker build --pull -t sub-store-selfhost:test .

      - name: Smoke test full container
        run: |
          docker run -d --name sub-store-smoke -p 127.0.0.1:3001:3001 sub-store-selfhost:test
          trap 'docker rm -f sub-store-smoke >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            STATUS="$(docker inspect --format '{{.State.Health.Status}}' sub-store-smoke)"
            if [ "$STATUS" = "healthy" ]; then
              docker exec sub-store-smoke test -x /opt/app/http-meta/http-meta
              docker exec sub-store-smoke test -x /usr/local/bin/shoutrrr
              docker exec sub-store-smoke test -s /opt/app/http-meta.bundle.js
              docker exec sub-store-smoke test -s /opt/app/frontend/index.html

              docker exec sub-store-smoke node -e "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"

              META_OK=0
              for j in $(seq 1 10); do
                if docker exec sub-store-smoke node -e "const net=require('net');const s=net.connect(9876,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"; then
                  META_OK=1
                  break
                fi
                sleep 1
              done
              test "$META_OK" = "1"

              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              docker logs sub-store-smoke
              exit 1
            fi

            sleep 2
          done

          docker logs sub-store-smoke
          exit 1
